<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Colegio Soldado de la Cruz</title>
  <link rel="shortcut icon" href="assets/LOGO-fondo2-remove.png"/>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="login-box">
    <img src="assets/LOGO-fondo2-remove.png" alt="Logo Colegio" class="logo">
    <h2>Colegio Soldado de la Cruz</h2>
    <p class="subtitulo">Acceso al Sistema de Matrícula</p>

    <!-- Botones para alternar entre Login y Registro -->
    <div class="tabs">
      <button type="button" id="btnTabLogin" class="tab active" onclick="cambiarVista('login')">Iniciar Sesión</button>
      <button type="button" id="btnTabRegistro" class="tab" onclick="cambiarVista('registro')">Registrarse</button>
    </div>

    <!-- FORMULARIO DE INICIO DE SESIÓN -->
    <form id="formLogin">
      <label for="loginEmail">Correo electrónico:</label>
      <input type="email" id="loginEmail" required placeholder="ejemplo@correo.com">

      <label for="loginPassword">Contraseña:</label>
      <input type="password" id="loginPassword" required placeholder="Ingresa tu contraseña">

      <button type="submit" class="btn-submit">Ingresar</button>
    </form>

    <!-- FORMULARIO DE REGISTRO DE CUENTA NUEVA -->
    <form id="formRegistro" style="display: none;">
      <label for="regNombre">Nombre completo (Padre o Tutor):</label>
      <input type="text" id="regNombre" required placeholder="Ej: Erick Corea">

      <label for="regEmail">Correo electrónico:</label>
      <input type="email" id="regEmail" required placeholder="ejemplo@correo.com">

      <label for="regPassword">Crear contraseña:</label>
      <input type="password" id="regPassword" required placeholder="Mínimo 6 caracteres">

      <button type="submit" class="btn-submit">Crear Cuenta</button>
    </form>

    <!-- Mensajes de error o confirmación -->
    <p id="mensajeEstado" class="mensaje"></p>

    <a href="index.html" class="volver">← Volver al inicio</a>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
